<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs>
    <style>
      .page { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .stage-title { font: 700 20px Arial, sans-serif; }
      .stage-label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .stage-small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .section-card { stroke-width: 2; rx: 18; ry: 18; }
      .item { fill: #ffffff; stroke-width: 1.5; rx: 10; ry: 10; }
      .note-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .note-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .rule { font: 700 18px Arial, sans-serif; fill: #14532d; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; }
      .soft-arrow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
    <linearGradient id="headerFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="35%" stop-color="#dcfce7"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1080"/>
  <rect x="50" y="40" width="1700" height="88" rx="18" fill="url(#headerFill)" stroke="#cbd5e1"/>
  <text class="title" x="90" y="84">ERP Finance System - Clean High Level Flow</text>
  <text class="subtitle" x="92" y="113">Readable business flow from setup to voucher entry, approval, posting, balances, and reports.</text>

  <!-- Main flow cards -->
  <g id="access">
    <rect class="section-card" x="60" y="180" width="220" height="390" fill="#eff6ff" stroke="#60a5fa"/>
    <text class="stage-title" x="104" y="220" fill="#1d4ed8">1. User Access</text>
    <rect class="item" x="85" y="255" width="170" height="58" stroke="#93c5fd"/>
    <text class="stage-label" x="116" y="289">Login</text>
    <rect class="item" x="85" y="330" width="170" height="58" stroke="#93c5fd"/>
    <text class="stage-label" x="111" y="363">Role &amp; Permissions</text>
    <rect class="item" x="85" y="405" width="170" height="58" stroke="#93c5fd"/>
    <text class="stage-label" x="104" y="438">Company Workspace</text>
    <text class="stage-small" x="88" y="515">Controls who can create,</text>
    <text class="stage-small" x="88" y="535">approve, post, or view.</text>
  </g>

  <g id="setup">
    <rect class="section-card" x="330" y="180" width="250" height="390" fill="#f0fdf4" stroke="#4ade80"/>
    <text class="stage-title" x="385" y="220" fill="#15803d">2. System Setup</text>
    <rect class="item" x="355" y="252" width="200" height="52" stroke="#86efac"/>
    <text class="stage-label" x="384" y="282">Company Settings</text>
    <rect class="item" x="355" y="318" width="200" height="52" stroke="#86efac"/>
    <text class="stage-label" x="385" y="348">Chart of Accounts</text>
    <rect class="item" x="355" y="384" width="200" height="52" stroke="#86efac"/>
    <text class="stage-label" x="400" y="414">Fiscal Year</text>
    <rect class="item" x="355" y="450" width="200" height="52" stroke="#86efac"/>
    <text class="stage-label" x="381" y="480">Posting Accounts</text>
    <text class="stage-small" x="358" y="535">Defines accounting rules</text>
    <text class="stage-small" x="358" y="555">before transactions start.</text>
  </g>

  <g id="master">
    <rect class="section-card" x="630" y="180" width="265" height="390" fill="#fff7ed" stroke="#fb923c"/>
    <text class="stage-title" x="696" y="220" fill="#c2410c">3. Master Data</text>
    <rect class="item" x="655" y="252" width="215" height="52" stroke="#fdba74"/>
    <text class="stage-label" x="692" y="277">Customers &amp; Suppliers</text>
    <text class="stage-small" x="700" y="295">linked GL accounts</text>
    <rect class="item" x="655" y="318" width="215" height="52" stroke="#fdba74"/>
    <text class="stage-label" x="687" y="348">Cash &amp; Bank Accounts</text>
    <rect class="item" x="655" y="384" width="215" height="52" stroke="#fdba74"/>
    <text class="stage-label" x="680" y="414">Items, Warehouses, UOM</text>
    <rect class="item" x="655" y="450" width="215" height="52" stroke="#fdba74"/>
    <text class="stage-label" x="700" y="480">Opening Balances</text>
    <text class="stage-small" x="658" y="535">Clean master data keeps</text>
    <text class="stage-small" x="658" y="555">posting simple and accurate.</text>
  </g>

  <g id="entry">
    <rect class="section-card" x="945" y="180" width="265" height="390" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text class="stage-title" x="1006" y="220" fill="#6d28d9">4. Entry</text>
    <rect class="item" x="970" y="252" width="215" height="52" stroke="#c4b5fd"/>
    <text class="stage-label" x="1006" y="282">Sales &amp; Purchase</text>
    <rect class="item" x="970" y="318" width="215" height="52" stroke="#c4b5fd"/>
    <text class="stage-label" x="1001" y="348">Cash &amp; Bank Vouchers</text>
    <rect class="item" x="970" y="384" width="215" height="52" stroke="#c4b5fd"/>
    <text class="stage-label" x="1014" y="414">Journal Vouchers</text>
    <rect class="item" x="970" y="450" width="215" height="52" stroke="#c4b5fd"/>
    <text class="stage-label" x="1008" y="475">Stock Documents</text>
    <text class="stage-small" x="1012" y="494">draft has no impact</text>
    <text class="stage-small" x="973" y="535">Users create or edit drafts</text>
    <text class="stage-small" x="973" y="555">until ready for approval.</text>
  </g>

  <g id="approval">
    <rect class="section-card" x="1260" y="180" width="235" height="390" fill="#fdf2f8" stroke="#f472b6"/>
    <text class="stage-title" x="1318" y="220" fill="#be185d">5. Approval</text>
    <rect class="item" x="1285" y="252" width="185" height="52" stroke="#f9a8d4"/>
    <text class="stage-label" x="1320" y="282">Save For Approval</text>
    <rect class="item" x="1285" y="318" width="185" height="52" stroke="#f9a8d4"/>
    <text class="stage-label" x="1321" y="348">Approval Queue</text>
    <path d="M 1377 379 L 1422 424 L 1377 469 L 1332 424 Z" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <text class="stage-label" x="1344" y="419">Approve</text>
    <text class="stage-label" x="1358" y="438">or Reject</text>
    <rect class="item" x="1285" y="489" width="185" height="52" stroke="#f9a8d4"/>
    <text class="stage-label" x="1317" y="514">Reject to Draft</text>
    <text class="stage-small" x="1312" y="533">editable again</text>
  </g>

  <g id="posting">
    <rect class="section-card" x="1545" y="180" width="205" height="390" fill="#ecfdf5" stroke="#34d399"/>
    <text class="stage-title" x="1586" y="220" fill="#047857">6. Posting</text>
    <rect class="item" x="1568" y="252" width="158" height="52" stroke="#6ee7b7"/>
    <text class="stage-label" x="1594" y="275">Post Approved</text>
    <text class="stage-small" x="1608" y="294">document</text>
    <rect class="item" x="1568" y="318" width="158" height="52" stroke="#6ee7b7"/>
    <text class="stage-label" x="1597" y="341">Accounting</text>
    <text class="stage-small" x="1595" y="360">voucher lines</text>
    <rect class="item" x="1568" y="384" width="158" height="52" stroke="#6ee7b7"/>
    <text class="stage-label" x="1592" y="407">Stock Movement</text>
    <text class="stage-small" x="1598" y="426">when applicable</text>
    <rect class="item" x="1568" y="450" width="158" height="52" stroke="#6ee7b7"/>
    <text class="stage-label" x="1588" y="473">Posted &amp; Locked</text>
    <text class="stage-small" x="1592" y="492">correction by void</text>
  </g>

  <!-- Flow arrows -->
  <path class="arrow" d="M 280 375 L 330 375" marker-end="url(#arrow-dark)"/>
  <path class="arrow" d="M 580 375 L 630 375" marker-end="url(#arrow-dark)"/>
  <path class="arrow" d="M 895 375 L 945 375" marker-end="url(#arrow-dark)"/>
  <path class="arrow" d="M 1210 375 L 1260 375" marker-end="url(#arrow-dark)"/>
  <path class="arrow" d="M 1495 375 L 1545 375" marker-end="url(#arrow-green)"/>
  <!-- Books and reporting lane -->
  <g id="books">
    <rect class="section-card" x="630" y="650" width="1120" height="245" fill="#f0f9ff" stroke="#38bdf8"/>
    <text class="stage-title" x="1110" y="690" fill="#0369a1">Books, Balances, Reports</text>

    <rect class="item" x="680" y="730" width="220" height="72" stroke="#7dd3fc"/>
    <text class="note-title" x="723" y="760">Accounting Books</text>
    <text class="note-text" x="715" y="784">vouchers + voucher lines</text>

    <rect class="item" x="940" y="730" width="220" height="72" stroke="#7dd3fc"/>
    <text class="note-title" x="991" y="760">Stock Records</text>
    <text class="note-text" x="979" y="784">movements + current stock</text>

    <rect class="item" x="1200" y="730" width="220" height="72" stroke="#7dd3fc"/>
    <text class="note-title" x="1249" y="760">Current Balances</text>
    <text class="note-text" x="1228" y="784">cash, bank, parties, inventory</text>

    <rect class="item" x="1460" y="720" width="245" height="92" stroke="#f59e0b" fill="#fffbeb"/>
    <text class="note-title" x="1525" y="750" fill="#92400e">Reports</text>
    <text class="note-text" x="1488" y="774">ledger, party, financial,</text>
    <text class="note-text" x="1507" y="794">inventory, dashboard</text>

    <path class="arrow" d="M 900 766 L 940 766" marker-end="url(#arrow-blue)" stroke="#0284c7"/>
    <path class="arrow" d="M 1160 766 L 1200 766" marker-end="url(#arrow-blue)" stroke="#0284c7"/>
    <path class="arrow" d="M 1420 766 L 1460 766" marker-end="url(#arrow-blue)" stroke="#0284c7"/>
  </g>

  <path class="arrow" d="M 1648 570 L 1648 650" marker-end="url(#arrow-green)" stroke="#16a34a"/>
  <text class="stage-small" x="1533" y="625" fill="#047857">Only posted documents update books</text>

  <!-- Controls lane -->
  <g id="controls">
    <rect class="section-card" x="60" y="650" width="520" height="245" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="stage-title" x="243" y="690" fill="#334155">System Controls</text>
    <rect class="item" x="95" y="730" width="205" height="58" stroke="#cbd5e1" fill="#ffffff"/>
    <text class="note-title" x="126" y="764">Open Period Check</text>
    <rect class="item" x="340" y="730" width="205" height="58" stroke="#cbd5e1" fill="#ffffff"/>
    <text class="note-title" x="381" y="754">Business Validation</text>
    <text class="note-text" x="369" y="774">balanced voucher, required data</text>
    <rect class="item" x="95" y="810" width="205" height="58" stroke="#cbd5e1" fill="#ffffff"/>
    <text class="note-title" x="139" y="844">Permissions</text>
    <rect class="item" x="340" y="810" width="205" height="58" stroke="#cbd5e1" fill="#ffffff"/>
    <text class="note-title" x="396" y="834">Audit Trail</text>
    <text class="note-text" x="367" y="854">created, approved, posted, voided</text>
  </g>

  <path class="soft-arrow" d="M 580 775 L 630 775" marker-end="url(#arrow-dark)"/>
  <path class="soft-arrow" d="M 320 650 L 320 600 L 1378 600 L 1378 570" marker-end="url(#arrow-dark)"/>
  <text class="stage-small" x="666" y="625">Controls apply during entry, approval, posting, and reporting.</text>

  <!-- Key rule -->
  <rect x="300" y="950" width="1200" height="76" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text class="rule" x="380" y="994">Key Rule: Draft records do not change ledger, cash, bank, party, or stock balances. Only approved and posted documents update books and reports.</text>
</svg>
