services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_DB: erp_financial_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: "#786Allahis1d"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://erp_user:%23786Allahis1d@postgres:5432/erp_financial_db?schema=public
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change_me_minimum_32_characters_long
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: erp_financial_db
      DATABASE_USER: erp_user
      DATABASE_PASSWORD: "#786Allahis1d"
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
    driver: local
