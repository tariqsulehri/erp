name: ERP CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Node 22, PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp_ci_password@localhost:5432/erp_ci
      TEST_DATABASE_URL: postgresql://erp:erp_ci_password@localhost:5432/erp_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Type Check Backend
        working-directory: backend
        run: npm run type-check

      # Proves a brand-new database can be built from the snapshot plus all migrations.
      - name: Install Database From Scratch
        working-directory: backend
        run: scripts/db-fresh-install.sh

      - name: Run Backend Tests (including database tests)
        working-directory: backend
        run: npm test

      - name: Build Backend
        working-directory: backend
        run: npm run build

      # Reported but not blocking: the remaining issues (zod) need a major upgrade, tracked in audit/REMEDIATION_PLAN.md.
      - name: Dependency Security Check
        working-directory: backend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend-ci:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps matches the Dockerfile until the test and lint packages are upgraded (DEP-003).
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type Check Frontend
        working-directory: frontend
        run: npm run type-check

      - name: Lint Frontend (no warnings allowed)
        working-directory: frontend
        run: npm run lint

      - name: No Raw Colours Outside The Brand Palette
        working-directory: frontend
        run: npm run check:colors

      - name: Run Frontend Tests (with coverage)
        working-directory: frontend
        run: npm run test:coverage -- --ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # Reported but not blocking: the remaining issues (next/postcss, zod) need major upgrades.
      - name: Dependency Security Check
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: No Keys Or Passwords In Git
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the secret check
        run: node --test scripts/check-secrets.test.mjs

      # Every tracked file, every line, comments included; also blocks .env, key, and dump files.
      - name: Scan the repository for secrets
        run: node scripts/check-secrets.mjs --all

      - name: Scan with gitleaks (second opinion)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  deployment-scripts:
    name: Deployment Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test deploy, status, rollback and backup scripts
        run: deployment/tests/lib.test.sh

  docker-images:
    name: Docker Images Build
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci, deployment-scripts, secrets ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t erp-backend:ci backend

      # The image runs database migrations on the server; the Prisma CLI must work inside it.
      - name: Check Prisma CLI Inside Backend Image
        run: docker run --rm erp-backend:ci node node_modules/prisma/build/index.js --version

      - name: Build Frontend Image
        run: docker build -t erp-frontend:ci frontend
