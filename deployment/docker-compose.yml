services:

  # ── Backend ───────────────────────────────────────────────
  backend:
    image: tariqsulehri/erp-be:${APP_TAG:-latest}
    platform: linux/amd64
    container_name: erp_be
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      NODE_ENV: production
      PORT: 5000
      OPENAI_CHAT_MODEL: gpt-4o-mini
      OPENAI_EMBED_MODEL: text-embedding-3-small
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: "*"
      MAX_FILE_SIZE_MB: 50
      UPLOAD_TEMP_DIR: /tmp/erp_be_uploads
      DEFAULT_COMPANY_ID: "00000000-0000-0000-0000-000000000001"
      SUPPORTED_LOCALES: en,ar,fr
      DEFAULT_LOCALE: en
    ports:
      - "3071:5000"
    volumes:
      - erp_be_uploads:/tmp/erp_be_uploads
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Next.js) ──────────────────────────────────
  frontend:
    image: tariqsulehri/erp-fe:${APP_TAG:-latest}
    platform: linux/amd64
    container_name: erp_fe
    restart: unless-stopped
    env_file:
      - .env.frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3070:3000"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/login', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  erp_be_uploads:
